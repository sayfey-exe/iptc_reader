<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lecteur IPTC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="dropzone">
    <p>Glissez-déposez des images ou des dossiers ici,<br>ou choisissez-les ci-dessous.</p>
    <div id="dropzoneButtons">
      <button id="btnPickFiles" type="button">Choisir des images</button>
      <button id="btnPickFolder" type="button">Choisir un dossier</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
  </div>

  <div id="viewer" hidden>
    <div id="toolbar">
      <button id="btnAdd" title="Ajouter des images">+ Images</button>
      <button id="btnAddFolder" title="Ajouter un dossier">+ Dossier</button>
      <button id="btnPrev" title="Image précédente">◀</button>
      <span id="counter"></span>
      <button id="btnNext" title="Image suivante">▶</button>
      <button id="btnClose" title="Tout fermer">✕</button>
    </div>

    <div id="main">
      <div id="preview">
        <img id="previewImg" alt="Aperçu">
        <div id="filename"></div>
      </div>

      <div id="metaPanel">
        <h2>IPTC</h2>
        <table id="iptcTable"><tbody></tbody></table>
        <p id="noIptc" hidden>Aucune donnée IPTC trouvée dans cette image.</p>
      </div>
    </div>

    <div id="filmstrip"></div>
  </div>

  <script src="vendor/exifr.js"></script>
  <script src="app.js"></script>
</body>
</html>
